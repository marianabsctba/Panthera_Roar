# Receptor de syslog cifrado (roar_ingestao.syslog_cifrado). Gerado: as rotas, a chave do repasse, o roteador e as saídas
# (uma por gerenciador, para o coletor dele) entram nos marcadores. Os marcadores não podem aparecer em comentário.
# Aceita TLS (a versão mínima é a padrão do OpenSSL do Vector, conferida em testar_syslog_cifrado.py), com enquadramento
# por contagem de bytes (RFC 5425) ou por linha. Endereço fora das rotas é descartado sem resposta.
data_dir: /var/lib/vector

sources:
  cifrado:
    type: socket
    mode: tcp
    address: 0.0.0.0:6514
    host_key: origem
    port_key: porta_de_origem
    max_connection_duration_secs: 86400
    framing:
      method: octet_counting
      octet_counting:
        max_length: 65000
    decoding:
      codec: bytes
    tls:
      enabled: true
      crt_file: /etc/recepcao/certificados/servidor.pem
      key_file: /etc/recepcao/certificados/servidor-chave.pem

transforms:
  rotear:
    type: remap
    inputs: [cifrado]
    drop_on_abort: true
    source: |
      ip = string(.origem) ?? ""
      # Lida como JSON: o tipo de cada rota não depende de a lista estar vazia.
      rotas = array(parse_json(s'__ROTAS__') ?? []) ?? []
      achadas = filter(rotas) -> |_indice, rota| { ip_cidr_contains(string(rota.rede) ?? "", ip) ?? false }
      if length(achadas) == 0 { abort }
      # Uma linha por mensagem no repasse: quebras de linha dentro da mensagem viram espaço.
      linha = replace(strip_whitespace(replace(string(.message) ?? "", r'^<\d{1,3}>', "")), r'[\r\n]+', " ")
      if linha == "" { abort }
      . = {"message": "ROAR __CHAVE__ " + ip + " " + linha, "gerenciador": achadas[0].gerenciador}

__SAIDAS__
