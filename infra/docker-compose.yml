# Portas só em 127.0.0.1. O servidor de fluxos ainda não tem autorizador configurado.
services:
  banco:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: roar-banco
    environment:
      POSTGRES_USER: roar_admin
      POSTGRES_PASSWORD: ${BANCO_SENHA}
      POSTGRES_DB: roar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - roar-banco:/var/lib/postgresql/data
    networks:
      - roar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roar_admin -d roar"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  postgresql:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: roar-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_SENHA}
    volumes:
      - roar-postgresql:/var/lib/postgresql/data
    networks:
      - roar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  temporal-esquema:
    image: temporalio/admin-tools:${TEMPORAL_VERSAO}
    container_name: roar-temporal-esquema
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - POSTGRES_SEEDS=postgresql
      - POSTGRES_USER=temporal
      - SQL_PASSWORD=${POSTGRES_SENHA}
    volumes:
      - ./temporal/esquema.sh:/esquema.sh:ro
    entrypoint: ["/bin/sh", "/esquema.sh"]
    networks:
      - roar

  temporal:
    image: temporalio/server:${TEMPORAL_VERSAO}
    container_name: roar-temporal
    depends_on:
      temporal-esquema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTGRES_SENHA}
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/roar.yaml
      # Só entra quem apresenta certificado da autoridade do Roar (infra/temporal_tls.sh).
      - TEMPORAL_TLS_REQUIRE_CLIENT_AUTH=true
      - TEMPORAL_TLS_SERVER_CA_CERT=/etc/temporal/tls/ca.pem
      - TEMPORAL_TLS_SERVER_CERT=/etc/temporal/tls/servidor.pem
      - TEMPORAL_TLS_SERVER_KEY=/etc/temporal/tls/servidor.key
      - TEMPORAL_TLS_INTERNODE_SERVER_NAME=temporal
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/tls/servidor.pem
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/tls/servidor.key
      - TEMPORAL_TLS_CLIENT1_CA_CERT=/etc/temporal/tls/ca.pem
      - TEMPORAL_TLS_FRONTEND_SERVER_NAME=temporal
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      - ./temporal-tls/servidor:/etc/temporal/tls:ro
    networks:
      - roar
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSAO}
    container_name: roar-temporal-namespace
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./temporal/namespace.sh:/namespace.sh:ro
      - ./temporal-tls/servidor:/etc/temporal/tls:ro
    entrypoint: ["/bin/sh", "/namespace.sh"]
    networks:
      - roar

  # A única porta aberta para fora. Com um domínio, tira o certificado sozinha; sem domínio, usa um próprio.
  borda:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: roar-borda
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - roar-borda-dados:/data
      - roar-borda-config:/config
    restart: unless-stopped

  # Armazém de eventos (docs/clickhouse.md). Também entra na rede dos gerenciadores, onde o coletor de cada um grava.
  armazem:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    container_name: roar-armazem
    environment:
      ARMAZEM_SENHA: ${ARMAZEM_SENHA}
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:${ARMAZEM_PORTA:-8123}:8123"
    volumes:
      - roar-armazem:/var/lib/clickhouse
      - ${ARMAZEM_FRIO:-./armazem-frio}:/var/lib/clickhouse-frio
      - ${ARMAZEM_COPIAS:-./armazem-copias}:/var/lib/clickhouse-copias
      - ./clickhouse/roar.xml:/etc/clickhouse-server/config.d/roar.xml:ro
      - ./clickhouse/usuarios.xml:/etc/clickhouse-server/users.d/roar.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - roar
      - gerenciadores
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # Syslog cifrado (roar_ingestao.syslog_cifrado): recebe com TLS e repassa ao coletor do gerenciador dono do endereço, na
  # rede dos gerenciadores. Relê a configuração sozinho quando as fontes mudam. A porta escuta só onde
  # SYSLOG_CIFRADO_ENDERECO mandar.
  recepcao:
    image: timberio/vector:0.60.0-debian@sha256:3ccb4bbd36e38734394e158db1411e91a69d076ed25013f8de385046a382d36a
    container_name: roar-recepcao
    # A pasta inteira: o syslog cifrado (recepcao.yaml) e os fluxos de rede (fluxos.yaml), cada um gerado à parte.
    command: ["--config-dir", "/etc/recepcao/configuracao", "--watch-config"]
    environment:
      - VECTOR_LOG=warn
    ports:
      - "${SYSLOG_CIFRADO_ENDERECO:-127.0.0.1}:${SYSLOG_CIFRADO_PORTA:-6514}:6514/tcp"
    volumes:
      - ./syslog-cifrado/configuracao:/etc/recepcao/configuracao:ro
      - ./syslog-cifrado/certificados:/etc/recepcao/certificados:ro
      - ./fluxos/dados:/var/fluxos:ro
      - roar-recepcao:/var/lib/vector
    networks:
      - gerenciadores
    restart: unless-stopped

  # Fluxos de rede (roar_ingestao.fluxos): NetFlow v5 e v9 e IPFIX na 2055, sFlow na 6343. Escreve um fluxo por linha,
  # em JSON, que o receptor leva ao coletor do gerenciador dono do exportador. As portas escutam só onde
  # FLUXOS_ENDERECO mandar.
  fluxos:
    image: netsampler/goflow2:v2.2.3@sha256:30f6e2a15db7a3848bf0ce4efb644c419fb761c0931f0cea27eac4f699b27287
    container_name: roar-fluxos
    command: ["-listen", "netflow://:2055,sflow://:6343", "-format", "json", "-transport", "file", "-transport.file", "/dados/fluxos.log"]
    ports:
      - "${FLUXOS_ENDERECO:-127.0.0.1}:${NETFLOW_PORTA:-2055}:2055/udp"
      - "${FLUXOS_ENDERECO:-127.0.0.1}:${SFLOW_PORTA:-6343}:6343/udp"
    volumes:
      - ./fluxos/dados:/dados
    restart: unless-stopped

volumes:
  roar-recepcao:
  roar-armazem:
  roar-borda-dados:
  roar-borda-config:
  roar-banco:
  roar-postgresql:

networks:
  roar:
    driver: bridge
  # Criada pelo Wazuh (infra/subir.sh sobe o indexador antes do armazém).
  gerenciadores:
    external: true
    name: panthera-roar-wazuh_default
