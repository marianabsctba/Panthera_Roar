# Portas só em 127.0.0.1. O servidor de fluxos ainda não tem autorizador configurado.
services:
  banco:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: roar-banco
    environment:
      POSTGRES_USER: roar_admin
      POSTGRES_PASSWORD: ${BANCO_SENHA}
      POSTGRES_DB: roar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - roar-banco:/var/lib/postgresql/data
    networks:
      - roar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roar_admin -d roar"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  postgresql:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    container_name: roar-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_SENHA}
    volumes:
      - roar-postgresql:/var/lib/postgresql/data
    networks:
      - roar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  temporal-esquema:
    image: temporalio/admin-tools:${TEMPORAL_VERSAO}
    container_name: roar-temporal-esquema
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - POSTGRES_SEEDS=postgresql
      - POSTGRES_USER=temporal
      - SQL_PASSWORD=${POSTGRES_SENHA}
    volumes:
      - ./temporal/esquema.sh:/esquema.sh:ro
    entrypoint: ["/bin/sh", "/esquema.sh"]
    networks:
      - roar

  temporal:
    image: temporalio/server:${TEMPORAL_VERSAO}
    container_name: roar-temporal
    depends_on:
      temporal-esquema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTGRES_SENHA}
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/roar.yaml
      # Só entra quem apresenta certificado da autoridade do Roar (infra/temporal_tls.sh).
      - TEMPORAL_TLS_REQUIRE_CLIENT_AUTH=true
      - TEMPORAL_TLS_SERVER_CA_CERT=/etc/temporal/tls/ca.pem
      - TEMPORAL_TLS_SERVER_CERT=/etc/temporal/tls/servidor.pem
      - TEMPORAL_TLS_SERVER_KEY=/etc/temporal/tls/servidor.key
      - TEMPORAL_TLS_INTERNODE_SERVER_NAME=temporal
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/tls/servidor.pem
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/tls/servidor.key
      - TEMPORAL_TLS_CLIENT1_CA_CERT=/etc/temporal/tls/ca.pem
      - TEMPORAL_TLS_FRONTEND_SERVER_NAME=temporal
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      - ./temporal-tls/servidor:/etc/temporal/tls:ro
    networks:
      - roar
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSAO}
    container_name: roar-temporal-namespace
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./temporal/namespace.sh:/namespace.sh:ro
      - ./temporal-tls/servidor:/etc/temporal/tls:ro
    entrypoint: ["/bin/sh", "/namespace.sh"]
    networks:
      - roar

  # A única porta aberta para fora. Com um domínio, tira o certificado sozinha; sem domínio, usa um próprio.
  borda:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: roar-borda
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - roar-borda-dados:/data
      - roar-borda-config:/config
    restart: unless-stopped

volumes:
  roar-borda-dados:
  roar-borda-config:
  roar-banco:
  roar-postgresql:

networks:
  roar:
    driver: bridge
