# Gerenciador do Wazuh de um cliente. Gerado por roar_ingestao.provisao.
# A API fica só em 127.0.0.1; as portas de agentes dependem de PORTAS_ENDERECO.
services:
  gerenciador:
    image: wazuh/wazuh-manager:${WAZUH_VERSAO}
    hostname: gerenciador-${GERENCIADOR_ID}
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "${PORTAS_ENDERECO}:${PORTA_EVENTOS}:1514"
      - "${PORTAS_ENDERECO}:${PORTA_INSCRICAO}:1515"
      - "127.0.0.1:${PORTA_API}:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=${INDEXER_USUARIO}
      - INDEXER_PASSWORD=${INDEXER_SENHA}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=roar
      - API_PASSWORD=${API_SENHA}
      - ROAR_INDICE=${INDICE}
      - ROAR_INDICE_BRUTO=${INDICE_BRUTO}
      - ROAR_SO_ARMAZEM=${ROAR_SO_ARMAZEM:-0}
    volumes:
      - api:/var/ossec/api/configuration
      - etc:/var/ossec/etc
      - logs:/var/ossec/logs
      - queue:/var/ossec/queue
      - multigroups:/var/ossec/var/multigroups
      - integrations:/var/ossec/integrations
      - active_response:/var/ossec/active-response/bin
      - agentless:/var/ossec/agentless
      - wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ${CERTIFICADOS}/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ${CERTIFICADOS}/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ${CERTIFICADOS}/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./authd.pass:/wazuh-config-mount/etc/authd.pass:ro
      - ./1-roar-filebeat:/etc/cont-init.d/1-roar-filebeat:ro
    networks:
      rede:
        aliases:
          - gerenciador-${GERENCIADOR_ID}

  # Leva os logs e os alertas ao armazém de eventos (docs/clickhouse.md), lendo a pasta de logs do gerenciador. Também
  # recebe o syslog dos equipamentos e o cifrado repassado pelo receptor da instalação (roar_ingestao.coletor_syslog) e
  # entrega ao analisador pelo socket da fila do gerenciador. A parte que muda com as fontes fica em coletor.d, que ele
  # relê sozinho.
  coletor:
    image: timberio/vector:0.60.0-debian@sha256:3ccb4bbd36e38734394e158db1411e91a69d076ed25013f8de385046a382d36a
    restart: unless-stopped
    command: ["--config", "/etc/vector/roar.yaml", "--config-dir", "/etc/vector/roar.d", "--watch-config"]
    environment:
      - GERENCIADOR_ID=${GERENCIADOR_ID}
      - VECTOR_LOG=warn
    volumes:
      - logs:/var/ossec/logs:ro
      - coletor:/var/lib/vector
      - ./vector.yaml:/etc/vector/roar.yaml:ro
      - ./coletor.d:/etc/vector/roar.d:ro
      - queue:/var/ossec/queue
      - ${GEOIP}:/etc/vector/geoip:ro
    ports:
      # Só aceita os endereços cadastrados em fontes de syslog desta organização.
      - "${PORTAS_ENDERECO}:${PORTA_SYSLOG}:514/tcp"
      - "${PORTAS_ENDERECO}:${PORTA_SYSLOG}:514/udp"
    networks:
      - rede

volumes:
  api:
  etc:
  logs:
  queue:
  multigroups:
  integrations:
  active_response:
  agentless:
  wodles:
  filebeat_etc:
  filebeat_var:
  coletor:

networks:
  rede:
    external: true
    name: ${REDE}
