# Sobre o compose oficial do Wazuh: só o indexer, com a porta em 127.0.0.1.
# Gerenciadores são um por cliente (infra/wazuh/gerenciador) e o dashboard não é usado.
# As senhas de fábrica do indexer são trocadas pelo instalador, em infra/senhas_do_indexador.sh.
services:
  wazuh.indexer:
    ports: !override
      - "127.0.0.1:9200:9200"
    # Cópia fria diária dos índices. Para guardar em NAS, monte o NAS nesta pasta antes de instalar.
    volumes:
      - /opt/panthera-roar/arquivo:/mnt/roar-arquivo
