# Sobre o compose oficial do Wazuh: portas só em 127.0.0.1, sem o dashboard (a tela é a do Roar).
# As senhas ainda são as padrão do compose oficial. Trocar antes de sair do ambiente de teste.
services:
  wazuh.manager:
    ports: !override
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"

  wazuh.indexer:
    ports: !override
      - "127.0.0.1:9200:9200"
